baseURL: "https://k8s-school.fr/"
title: "K8s-school"
languageCode: "fr-fr"
theme: "hugo-up-business"
summaryLength: 20
disableKinds: ["robotsTXT"]
ignoreErrors: ["error-missing-instagram-accesstoken"]
ignoreLogs: ["warning-goldmark-raw-html"]

markup:
  goldmark:
    renderer:
      unsafe: true

imaging:
  quality: 30
  disableLatLong: true

build:
  publishDir: "public"
  # Collecte les classes CSS du HTML généré (contenu inclus) pour Tailwind, et
  # force la recompilation du CSS quand elles changent.
  buildStats:
    enable: true
  cachebusters:
    - source: "assets/notwatching/hugo_stats\\.json"
      target: "css"

module:
  mounts:
    - source: "hugo_stats.json"
      target: "assets/notwatching/hugo_stats.json"
      disableWatch: true
    - source: "assets"
      target: "assets"
    - source: "content"
      target: "content"
    - source: "static"
      target: "static"
    - source: "layouts"
      target: "layouts"
    - source: "data"
      target: "data"
    - source: "archetypes"
      target: "archetypes"

services:
  googleAnalytics:
    id: "UA-146891246-1"

